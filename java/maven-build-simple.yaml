parameters:
  - name: goal
    displayName: Maven Goal
    type: string
    default: 'package'
    values:
      - package
      - clean
      - install
      - compile
      - deploy

  - name: jdkVersion
    displayName: Java Version
    type: string
    default: '1.11'

  - name: pomFilePath
    displayName: Maven POM File
    type: string
    default: 'pom.xml'

  - name: pathToPublish
    displayName: Path To Publish
    type: string
    default: 'gameoflife-web/target/gameoflife.war'
  - name: authenticateMavenFeed
    type: boolean
    default: true
steps:
  - task: Maven@3
    inputs:
      mavenPOMFile: '${{ parameters.pomFilePath }}'
      goals: '${{ parameters.goal }}'
      publishJUnitResults: true
      testResultsFiles: '**/surefire-reports/TEST-*.xml'
      jdkVersionOption: '${{ parameters.jdkVersion }}'
      mavenAuthenticateFeed: ${{ parameters.authenticateMavenFeed }}
  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: '${{ parameters.pathToPublish }}'
      artifact: 'drop'
      publishLocation: 'pipeline'